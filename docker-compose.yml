services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigface}
      POSTGRES_USER: ${POSTGRES_USER:-bigface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigface}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigface}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./packages/backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bigface}:${POSTGRES_PASSWORD:-bigface}@postgres:5432/${POSTGRES_DB:-bigface}
      AUTO_MIGRATE: "true"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./packages/frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
