server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;


  # API + realtime go to the backend service
  location /api/ {
    proxy_pass https://big-face-production.up.railway.app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host big-face-production.up.railway.app;
    proxy_ssl_server_name on;
  }
  location /socket.io/ {
    proxy_pass https://big-face-production.up.railway.app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host big-face-production.up.railway.app;
    proxy_ssl_server_name on;
  }
  location /uploads/ {
    proxy_pass https://big-face-production.up.railway.app;
    proxy_set_header Host big-face-production.up.railway.app;
    proxy_ssl_server_name on;
  }


  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
